[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketcast-lab"
version = "0.1.0"
description = "Leakage-safe financial time-series forecasting experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14,<1",
  "torch>=2.2,<3",
  "requests>=2.31,<3",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
legacy = [
  "matplotlib>=3.8",
  "plotly>=5.18",
  "prophet>=1.1",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "streamlit>=1.32",
  "tensorflow>=2.16",
]
dev = ["pytest>=8", "pytest-cov>=5"]
boosting = ["xgboost>=2.1,<4"]
dashboard = ["streamlit>=1.39,<2"]
presentation = ["python-pptx>=1.0,<2"]

[project.scripts]
marketcast = "market_forecast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

